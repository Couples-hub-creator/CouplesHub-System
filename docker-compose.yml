version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.0.0
    container_name: discord-bot-lavalink
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "2333:2333"
    depends_on:
      - postgres

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      lavalink:
        condition: service_started
    volumes:
      - ./packages/bot:/app/packages/bot
      - /app/packages/bot/node_modules
      - /app/node_modules

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: discord-bot-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - bot
    volumes:
      - ./packages/dashboard:/app/packages/dashboard
      - /app/packages/dashboard/node_modules
      - /app/node_modules

  caddy:
    image: caddy:2-alpine
    container_name: discord-bot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
